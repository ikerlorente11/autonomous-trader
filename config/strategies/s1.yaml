# CANDIDATE (backtest-only): v3 + equal-risk sizing — risk 0.4% of portfolio value
# per position with the stop distance (ATR × multiple) as the risk unit,
# MAX_POSITION_PCT still the notional ceiling. Calibration: the ceiling binds when
# ATR < ~3.2% of price (target/(multiple·cap)), so calm names cap at 5% notional and
# volatile ones size DOWN — a risk reducer, never leverage. (1% made the ceiling bind
# for every name → byte-for-byte v3.)
scoring:
  weights: {atr: 0.0}
  rank_normalize: true
indicators:
  rsi: {mode: mean_reversion}
  ma_trend: {extension_cap: 0.02}
trading:
  stop_reentry_cooldown_days: 3
  stop_min_distance_pct: 0.05
  allow_pyramiding: false
  vol_target_pct: 0.004
