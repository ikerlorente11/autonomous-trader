# Strategy version "v6" — built ON TOP of v5 (v6 = v5 + delta) so the A/B isolates the
# v6 effect over v5. v5's keys are repeated and the v6-only addition is marked.
# Rationale: docs/diagnostics/05-plan-v5-v6.md.

scoring:
  weights:
    # P1 (from v2): ATR out of the score — only sizing/stops use it.
    atr: 0.0
    # P11 phase 1 (from v4): cross-sectional price momentum.
    momentum: 0.40
    # v6 delta: activate the fundamental signals computed since Phase 5 in
    # observation mode (quality composite + revenue/earnings acceleration,
    # signals.py). Rank-normalized like everything else, so each is the symbol's
    # percentile within the day's universe. Missing values are dropped and the
    # remaining weights renormalize — a symbol without fundamentals is scored on
    # its other signals, never imputed (synthesis §3.3).
    quality: 0.15
    revenue_accel: 0.10
    earnings_accel: 0.10
  # P7 (from v3): rank-normalize each weighted sub-score across the day's universe.
  rank_normalize: true
  # P11 phase 2 (from v5): macro regime multiplier.
  regime_multiplier:
    floor: 0.75
    ceil: 1.05

indicators:
  rsi:
    # P4 (from v2): contrarian RSI — oversold scores high.
    mode: mean_reversion
  ma_trend:
    # P5 (from v2): cap the "how far above the MA" reward at +2% (trend gate, not a chase).
    extension_cap: 0.02

trading:
  # P2/P3/P6 (from v2): re-entry cooldown, stop-distance floor, no pyramiding.
  stop_reentry_cooldown_days: 3
  stop_min_distance_pct: 0.05
  allow_pyramiding: false
