# Strategy version "v9" — v8 + leg-switched ENTRY discipline (one variable vs v8).
# The two-window bake-off showed v8 beats v3 in both regimes but captures almost
# none of raw v1's trend upside (+1.4% vs +28.4% long-window): the fixed v3-style
# discipline (no pyramiding, cooldown) forbids exactly the churn that won the trend.
# v9 keeps v8's switch and lets the day's ACTIVE LEG govern entries: v1's config
# (pyramiding allowed, no cooldown) when SPY >= its 100d MA, v3's brakes below.
# Protective-stop parameters do NOT switch — they stay on this version's block.
# Rationale: docs/diagnostics/07-plan-v7-v8.md §3 (the "future v9" note).
regime_switch:
  benchmark: SPY
  ma_period: 100
  kind: sma
  trend: v1
  chop: v3
  trading_from_leg: true

trading:
  # Constant protection in every regime (same floor as v8); entry knobs come from
  # the active leg, so none are set here.
  stop_min_distance_pct: 0.05
