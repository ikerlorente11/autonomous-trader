# Autonomous Trader — Raspberry Pi 4 (ARM64) deployment.
# Three long-running services (db, api, scheduler) + one short-lived init job.
# Services communicate ONLY through the database (CLAUDE.md). Run from repo root:
#   docker compose -f docker/docker-compose.yml up -d
#
# All app config comes from .env (env_file). The api/scheduler need DATABASE_URL
# (async, +asyncpg); the db container needs the POSTGRES_* vars. DATABASE_URL and
# the POSTGRES_* values must describe the same database — see .env.example.
#
# Host-port allocation — this project owns the 8030-8039 range (siblings: manager
# 800x, landing 801x, portfolio 802x). Every host-published port MUST stay in
# range so future containers never collide with the conventional 5432/8000/etc:
#   8030 -> api       (container 8000)
#   8031 -> db        (container 5432)
#   8032 -> scheduler (container 8000 — no network listener yet; the mapping just
#                      reserves the host port against future conflicts)
#   8033-8039 -> free

x-app-image: &app-image
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  db:
    image: timescale/timescaledb:latest-pg16   # verified ARM64
    container_name: trader-db
    restart: unless-stopped
    env_file: ../.env
    environment:
      # TimescaleDB tuned conservatively for the Pi 4 RAM budget (< 200 MB idle).
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: "2"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 640m, above CLAUDE.md's < 200 MB idle target: measured anon usage is ~437 MB and
    # the cgroup sat at its old 512 MB ceiling (389k reclaim events, one OOM kill —
    # the 2026-08-04 blackout). DB_POOL_RECYCLE is the actual cure; this is the margin
    # that keeps a spike from killing a backend again. Host has ~1.2 GB free.
    mem_limit: 640m
    # Host port stays inside this project's reserved range (8030-8039) so it never
    # squats the conventional host 5432 a future Postgres might want.
    ports:
      - "${DB_PORT:-8031}:5432"

  # One-shot: waits for db health, runs `alembic upgrade head`, exits.
  # Migrations therefore run exactly once per `up`, before api/scheduler start.
  init:
    <<: *app-image
    container_name: trader-init
    command: ["./docker/init-db.sh"]
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  api:
    <<: *app-image
    container_name: trader-api
    command:
      ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../.env
    ports:
      # Host port is configurable (8000 is often already in use); container stays 8000.
      - "${API_PORT:-8030}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 320m

  scheduler:
    <<: *app-image
    container_name: trader-scheduler
    command: ["python", "-m", "backend.scheduler.main"]
    env_file: ../.env
    # In-range host port like the rest. APScheduler runs no network server, so
    # nothing answers on 8032 yet — the mapping only reserves the host port.
    ports:
      - "${SCHEDULER_PORT:-8032}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 512m   # idle < 100 MB, peak ~400 MB during analysis (CLAUDE.md)

volumes:
  postgres_data:
