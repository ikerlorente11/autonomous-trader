name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    # The suite has DB-backed integration tests; provision the same TimescaleDB the Pi
    # runs, then create + migrate the isolated test database (scripts/setup-test-db.sh).
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # setup-test-db.sh connects to the maintenance "postgres" DB to create
      # autonomous_trader_test; the root conftest repoints this URL at that test DB.
      DATABASE_URL: postgresql+asyncpg://trader:trader@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend

      - name: Create + migrate the test database
        run: bash scripts/setup-test-db.sh

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # No vitest in frontend/package.json devDependencies — frontend unit tests
      # are intentionally skipped (see backend/tests handoff). The build is the gate.
