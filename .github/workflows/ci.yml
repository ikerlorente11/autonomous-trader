name: CI

# Common CI (github.com/ikerlorente11/ci) where it fits: the frontend and the arm64 image to GHCR, which the Pi pulls
# (deploy.yml, once this run succeeds on main). The backend keeps its own job: it needs a TimescaleDB service.
# Every Monday the image again without cache, so that updates of the base and the dependencies get in.
on:
  push:
    branches: [main]
    # Docs only: no CI run (on Mondays and by hand everything runs anyway)
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "LICENSE"]
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which half changed (changes.yml of the common CI): each test job runs only for its own. Everything counts as
  # changed on the Monday cron, when run by hand or when the workflows themselves change.
  changes:
    uses: ikerlorente11/ci/.github/workflows/changes.yml@main
    with:
      filters: |
        backend: ['backend/**', 'config/**', 'scripts/**', 'docker/**', 'pyproject.toml', 'conftest.py']
        frontend: ['frontend/**']

  backend:
    name: Backend lint + tests
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'backend')
    runs-on: ubuntu-latest
    # The suite has DB-backed integration tests; provision the same TimescaleDB the Pi
    # runs, then create + migrate the isolated test database (scripts/setup-test-db.sh).
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # setup-test-db.sh connects to the maintenance "postgres" DB to create
      # autonomous_trader_test; the root conftest repoints this URL at that test DB.
      DATABASE_URL: postgresql+asyncpg://trader:trader@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend

      - name: Create + migrate the test database
        run: bash scripts/setup-test-db.sh

      - name: Pytest
        run: pytest

  frontend:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'frontend')
    uses: ikerlorente11/ci/.github/workflows/node.yml@main
    with:
      directory: frontend
      node: "20"
      # No vitest in frontend/package.json devDependencies: svelte-check and the build are the gate.
      test: "npm run check && npm run build"

  # On every push to main that is not docs only, so that each deployed commit has its image: the build is
  # reproducible, so a commit that changes nothing the image carries yields the same one and deploy.sh leaves the
  # containers alone. always() so a skipped test job does not skip it; it waits for the ones that ran to pass.
  image:
    if: always() && (github.ref_name == github.event.repository.default_branch || github.event_name == 'schedule')
        && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, backend, frontend]
    uses: ikerlorente11/ci/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      name: autonomous-trader
      file: docker/Dockerfile
